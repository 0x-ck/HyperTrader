version: '3.8'

services:
  oracle:
    build: .
    ports:
      - "3000:3000"
    environment:
      - RPC_URL=${RPC_URL:-http://host.docker.internal:8899}
      - ORACLE_KEYPAIR_PATH=/app/oracle-keypair.json
      - PORT=3000
      - PROGRAM_ID=${PROGRAM_ID:-9GbrovAKnWfbXuq5dXYiZgZob75qTBz9HFcZGFRjftcH}
    volumes:
      - ./oracle-keypair.json:/app/oracle-keypair.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

